<!-- rtsp/dashboard/index.html -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title> CCTV 관제</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    h1 {
      padding: 16px;
      margin: 0;
      background: #1d1d1d;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }

    .title {
      padding: 8px;
      font-size: 14px;
      background: #222;
    }

    video {
      width: 100%;
      height: 240px;
      background: black;
    }
  </style>
</head>

<body>
  <h1>📡 ROGOS CCTV 관제 화면</h1>
  <div class="grid" id="grid"></div>

  <script>
    fetch("../cctv_sources.json")
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById("grid");

        data.forEach(cam => {
          const card = document.createElement("div");
          card.className = "card";

          const title = document.createElement("div");
          title.className = "title";
          title.innerText = cam.name;

          const video = document.createElement("video");
          video.autoplay = true;
          video.muted = true;
          video.controls = true;

          card.appendChild(title);
          card.appendChild(video);
          grid.appendChild(card);

          if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(cam.hls_url);
            hls.attachMedia(video);
          } else {
            video.src = cam.hls_url;
          }
        });
      });
  </script>
</body>
</html>
