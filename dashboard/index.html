<!-- rtsp/dashboard/index.html -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>ROBOS CCTV 관제 화면</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px 24px;
      background: #1d1d1d;
      border-bottom: 1px solid #333;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    .card-title {
      padding: 10px 12px;
      font-size: 15px;
      background: #222;
      border-bottom: 1px solid #333;
    }

    video {
      width: 100%;
      height: 280px;
      background: black;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <header>
    <h1>ROBOS CCTV 관제 화면</h1>
  </header>

  <main class="grid">
    <section class="card">
      <div class="card-title">서울 - 원효대교 북단</div>
      <video id="video-seoul-424" muted autoplay controls playsinline></video>
    </section>
  </main>

  <script>
    const streams = [
      {
        videoId: "video-seoul-424",
        hlsUrl: "http://localhost:8888/seoul_424/index.m3u8"
      }
    ];

    streams.forEach(({ videoId, hlsUrl }) => {
      const video = document.getElementById(videoId);

      if (Hls.isSupported()) {
        const hls = new Hls({
          liveSyncDuration: 3
        });

        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = hlsUrl;
      }
    });
  </script>
</body>
</html>
